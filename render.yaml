# NOTE: nrsms-backend was created directly in the Render dashboard (not via
# this Blueprint), so Render will not auto-provision/sync env vars from this
# file. The live DATABASE_URL is set by hand in the dashboard (Settings ->
# Environment) and points at a Neon Postgres database, not a Render Postgres
# instance -- Render's free Postgres tier auto-deletes databases after 30
# days, so Neon's always-free tier is used instead. `sync: false` below
# means Render leaves whatever value is already set on the live service alone.
services:
  - type: web
    name: nrsms-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_SUPERUSER_EMAIL
        value: admin@nrsms.go.ke
      - key: FIRST_SUPERUSER_PASSWORD
        value: Internal
